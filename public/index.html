<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Clientes Interesados</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f6f9; }
    h1, h2 { color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #0066cc; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background: #0052a3; }
    .alert { padding: 12px; margin-top: 15px; border-radius: 4px; font-weight: bold; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    ul { list-style: none; padding: 0; }
    li { background: #f8f9fa; margin-bottom: 8px; padding: 10px; border-left: 4px solid #0066cc; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Registro de Interesados</h1>
    <form id="clienteForm">
      <div class="form-group">
        <label for="nombre">Nombre Completo *</label>
        <input type="text" id="nombre" required placeholder="Ej. Luis Giménez">
      </div>
      <div class="form-group">
        <label for="edad">Edad *</label>
        <input type="number" id="edad" required min="1" placeholder="Ej. 25">
      </div>
      <div class="form-group">
        <label for="ciudad">Ciudad *</label>
        <input type="text" id="ciudad" required placeholder="Ej. Caracas">
      </div>
      <button type="submit">Enviar Registro</button>
    </form>
    <div id="respuesta" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Historial de Clientes Registrados</h2>
    <ul id="listaClientes">
      <li>Cargando registros...</li>
    </ul>
  </div>

  <script src="main.js"></script>
</body>
</html>
